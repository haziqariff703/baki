name: Generate README

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-readme
  cancel-in-progress: false

jobs:
  generate:
    name: Generate README review PR
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ReadmeAI
        run: pip install "readmeai[openai]"

      - name: Generate README
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add OPENAI_API_KEY in Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi
          readmeai --repository . --api openai --output README.md

      - name: Create README review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi

          branch="automation/readme-ai-${{ github.run_id }}"
          git switch --create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: generate README with ReadmeAI"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base master \
            --head "$branch" \
            --title "docs: generate README" \
            --body "Generated by the repository-owned ReadmeAI workflow. Review before merging."
